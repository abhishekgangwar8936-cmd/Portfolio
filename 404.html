<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Abhishek Gangwar Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23FF6B2B' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'><rect x='20' y='20' width='60' height='60' rx='12' transform='rotate(45 50 50)' /><path d='M35 63 L50 36 L65 63 M40 53h20' /></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    // Smart auto-redirect: strip legacy /portfolio/ or /Portfolio/ prefix
    (function() {
      var path = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // If user visited via legacy /portfolio or /Portfolio prefix, remove it and redirect cleanly
      if (path.toLowerCase().startsWith('/portfolio')) {
        var cleanPath = path.replace(/^\/portfolio\/?/i, '/');
        if (!cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;
        window.location.replace(cleanPath + search + hash);
        return;
      }
    })();
  </script>
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #09090b;
      color: #fafafa;
    }
    h1, h2, h3 {
      font-family: 'PT Sans', sans-serif;
    }
    .glow {
      position: absolute;
      border-radius: 9999px;
      filter: blur(120px);
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-black text-white">
  <!-- Ambient background glow -->
  <div class="glow w-96 h-96 bg-[#FF6B2B]/20 -top-20 -right-20"></div>
  <div class="glow w-96 h-96 bg-blue-500/15 -bottom-20 -left-20"></div>

      <a href="projects" class="w-full py-3 px-4 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-zinc-800 font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2">
